<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tile: the Palestinian flag -->
  <g filter="url(#shadow)">
    <g clip-path="url(#tile)">
      <rect x="100" y="100" width="824" height="275" fill="#141414"/>
      <rect x="100" y="375" width="824" height="275" fill="#F5F5F5"/>
      <rect x="100" y="650" width="824" height="274" fill="#149954"/>
      <polygon points="100,100 471,512 100,924" fill="#E4312B"/>
      <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>
    </g>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Badge: a paper plane, for "send request" -->
  <g filter="url(#badgeShadow)">
    <circle cx="690" cy="512" r="176" fill="#141414"/>
    <circle cx="690" cy="512" r="176" fill="none" stroke="#F5F5F5" stroke-width="16"/>
  </g>
  <g transform="translate(690 512) rotate(-20)">
    <polygon points="-105,-8 112,-82 38,108 8,30" fill="#F5F5F5"/>
    <polygon points="8,30 112,-82 -2,92" fill="#C9C9C9"/>
    <polygon points="8,30 38,108 -2,92" fill="#149954"/>
  </g>
</svg>
