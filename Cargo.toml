[package]
name = "gaza-man"
version = "2.0.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
eframe = { version = "0.37", features = ["persistence"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
png = "0.18"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "svgz"] }
rfd = "0.17"
rquickjs = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-bidi = "0.3"
ureq = "3"
webpki-roots = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
# Smaller downloads; still fast.
strip = true
lto = "thin"
codegen-units = 4
